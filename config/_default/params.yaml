# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
# theme: shilaan_theme
# day_night: true
# font: 'shilaan_font'
# font_size: L

appearance:
  mode: system
  color: blue
  font: minimal
  font_size: L

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: ''
    twitter: 'GetResearchDev'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
# main_menu:
#   enable: true
#   align: l
#   show_logo: true
#   show_language: false
#   show_day_night: true
#   show_search: true
#   highlight_active_link: true

header:
  navbar:
    # Display the navigation bar?
    enable: true
    # Choose a built-in navigation blox or create your own
    blox: "navbar"
    # Align menu links: `left`, `center`, or `right`
    align: "center"
    # Fix the navigation bar to the top of the page
    fixed_to_top: true
    logo: 
      # Logo text
      filename: "ill1.png"
      text: "Abhishek Pai"
    show_theme_chooser: true
    # Let the user search from the navigation bar?
    show_search: true
    highlight_active_link: true
    highlight_active_link_style: dracula

# Site footer
footer:
  block: minimal
  copyright:
    notice: '© {year} Abhishek Pai. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
highlight: true
highlight_style: dracula
icon:
  pack:
    ai: true
features:
  math:
    enable: false
  privacy_pack:
    enable: false
